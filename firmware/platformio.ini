; PlatformIO Project Configuration File
; Targets:
;   1. [env:guition-4inch-720x720]   — Guition 4" 720x720 Square Panel (ESP32-S3 16MB Flash + 8MB Octal PSRAM)
;   2. [env:waveshare-esp32s3-touch-lcd-4b] — Waveshare ESP32-S3 4" 480x480 RGB Panel (native 480 UI: src/app_480, board_480, ui_480)
;      [env:waveshare-esp32s3-4b-scaled-legacy] — same board, legacy 720 UI downscaled at flush (comparison only)
;   3. [env:waveshare-esp32p4-720x720] — Waveshare ESP32-P4 4" 720x720 MIPI-DSI Panel (ESP32-P4 + ESP32-C6 Wi-Fi)

[platformio]
default_envs = guition-4inch-720x720, waveshare-esp32p4-720x720

[common]
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DDISP_HOR_RES=720
  -DDISP_VER_RES=720
  -DLV_CONF_INCLUDE_SIMPLE
  -I src
lib_deps =
  https://github.com/tzapu/WiFiManager.git
  bblanchon/ArduinoJson @ ^7.2.0
  lvgl/lvgl @ ^8.4.0

[env:guition-4inch-720x720]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_src_filter = +<*> -<app_480/> -<board_480/> -<ui_480/>
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:waveshare-esp32s3-touch-lcd-4b]
extra_scripts = post:tools/check_app_image.py
; Use pioarduino's hybrid SDK build so PSRAM XIP changes the linked IDF libraries.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = partitions_s3_assets.csv
build_src_filter = +<*> -<main.cpp> -<stage_3d_assets.cpp> -<cjk_fonts.cpp> -<dashboard_cjk_fallback.cpp> -<dashboard_cjk_48.cpp> -<dashboard_home_cjk.cpp> -<universal_sans_fonts.cpp> -<s3_latin_48.cpp>
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; Settings compile-check in display_driver.hpp and are linked into the SDK, not app-only defines.
custom_sdkconfig =
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_FREERTOS_HZ=1000
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_32B=n
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
build_flags =
  -DBOARD_HAS_PSRAM
  -DDISP_HOR_RES=480
  -DDISP_VER_RES=480
  -DLV_CONF_INCLUDE_SIMPLE
  -I src
  -DPOWERWALL_WAVESHARE_S3_LCD_4B
  -DPOWERWALL_NATIVE480=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  ${common.lib_deps}
  https://github.com/moononournation/Arduino_GFX.git#v1.6.9

[env:waveshare-esp32s3-touch-lcd-4b-en]
extends = env:waveshare-esp32s3-touch-lcd-4b
build_flags =
  ${env:waveshare-esp32s3-touch-lcd-4b.build_flags}
  -DPOWERWALL_NATIVE480_LANG_EN=1

; Customer release targets omit serial preview commands and development diagnostics.
; The base zh/en targets retain those diagnostics for development builds.
[env:waveshare-esp32s3-touch-lcd-4b-release]
extends = env:waveshare-esp32s3-touch-lcd-4b
build_flags =
  ${env:waveshare-esp32s3-touch-lcd-4b.build_flags}
  -DPOWERWALL_NATIVE480_RELEASE=1

[env:waveshare-esp32s3-touch-lcd-4b-en-release]
extends = env:waveshare-esp32s3-touch-lcd-4b-en
build_flags =
  ${env:waveshare-esp32s3-touch-lcd-4b-en.build_flags}
  -DPOWERWALL_NATIVE480_RELEASE=1

[env:waveshare-esp32s3-4b-scaled-legacy]
extra_scripts = post:tools/check_app_image.py
; Use pioarduino's hybrid SDK build so PSRAM XIP changes the linked IDF libraries.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = partitions_s3_assets.csv
build_src_filter = +<*> -<app_480/> -<board_480/> -<ui_480/> -<cjk_fonts.cpp> -<dashboard_cjk_fallback.cpp> -<dashboard_cjk_48.cpp> -<dashboard_home_cjk.cpp> -<universal_sans_fonts.cpp> -<s3_latin_48.cpp>
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; Settings compile-check in display_driver.hpp and are linked into the SDK, not app-only defines.
custom_sdkconfig =
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_FREERTOS_HZ=1000
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_32B=n
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
build_flags =
  ${common.build_flags}
  -DPOWERWALL_WAVESHARE_S3_LCD_4B
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  ${common.lib_deps}
  https://github.com/moononournation/Arduino_GFX.git#v1.6.9

; Headless esp-emu run: retain the shared LVGL UI, replace only LCD/touch I/O.
[env:waveshare-esp32p4-emu]
extends = env:waveshare-esp32p4-720x720
build_flags =
  ${env:waveshare-esp32p4-720x720.build_flags}
  -DPOWERWALL_EMULATOR_HEADLESS
  -Wl,--wrap=ecp_mul_restartable_internal
  -Wl,--wrap=mbedtls_ecp_check_pubkey

[env:waveshare-esp32p4-720x720]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_src_filter = +<*> -<app_480/> -<board_480/> -<ui_480/>
build_flags =
  ${common.build_flags}
  -DCONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=20
lib_deps = ${common.lib_deps}
