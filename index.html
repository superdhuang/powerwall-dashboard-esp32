<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=720, initial-scale=1.0, user-scalable=no">
  <title>ESP32-P4 (720×720) — 我的家 Powerwall Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <style>
    .tesla-panel {
      background: rgba(19, 21, 26, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }
    .bar-offpeak {
      background-color: #26a64c;
      height: 10px;
    }
    .bar-peak {
      background-color: #b9312f;
      height: 20px;
      box-shadow: 0 0 14px rgba(185, 49, 47, 0.45);
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#07080a] text-zinc-100 antialiased min-h-screen w-screen overflow-hidden select-none flex flex-col items-center justify-center m-0 p-0">

  <!-- Outside 720x720 screen: only appears if browser blocks automatic Captive Portal window.open on first boot -->

    <button
      type="button"
      onclick="launchCaptivePortalPopup()"
      class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-[#1fa3ec] hover:bg-[#0e70a4] text-white text-xs font-bold shadow-2xl border border-white/20 cursor-pointer animate-bounce"
    >
      📶 偵測到第一次開機 AP (Powerwall-ESP32P4) — 點此彈出 WiFiManager 認證視窗
    </button>
  </div>

  <!-- ================= ESP32-P4 720x720 HARDWARE DISPLAY VIEWPORT ================= -->
  <main id="esp32-p4-screen" class="relative flex flex-col gap-2 bg-[#0b0c0f] p-2 overflow-hidden shrink-0 shadow-[0_0_60px_rgba(0,0,0,0.9)]" style="width: 720px; height: 720px;">

    <!-- ================= 1. HERO: TESLA 3D HOUSE + LIVE WEATHER & MOON PHASE ================= -->
    <section id="hero-sky-section" class="flex-1 min-h-0 flex flex-col rounded-2xl border border-white/10 overflow-hidden relative shadow-2xl bg-[#101820]">

      <!-- 3D WebGL Stage Container (Locked Camera Angle) -->
      <div id="stage-container" class="relative w-full flex-1 min-h-0 bg-[#101820] overflow-hidden">
        <canvas id="stage" class="w-full h-full block pointer-events-none"></canvas>

        <!-- Floating Header Overlay Inside the 3D Scene -->
        <div class="pointer-events-none absolute top-3 left-4 right-4 flex items-center justify-between gap-2 z-20 whitespace-nowrap">
          <div class="flex items-center gap-2.5 overflow-x-auto no-scrollbar">
            <h1 id="site-title" class="text-lg font-bold tracking-wide text-white drop-shadow-[0_1px_6px_rgba(0,0,0,0.9)]">我的家</h1>
            <span id="live-status-pill" onclick="toggleStatusIpMode()" class="pointer-events-auto cursor-pointer flex items-center gap-1.5 text-[11px] px-2.5 py-0.5 rounded-full bg-black/35 backdrop-blur-sm text-emerald-400 border border-emerald-500/30 select-none">
              <span id="live-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
              <span id="live-status-text" class="tabular-nums">連線中</span>
            </span>
          </div>

          <span id="weather-badge" class="flex items-center gap-1.5 text-[11px] px-2.5 py-0.5 rounded-full bg-black/35 backdrop-blur-sm text-sky-200 border border-white/15 font-medium whitespace-nowrap shrink-0">
            ⛅ 載入即時天氣與月相中...
          </span>
        </div>

        <!-- Tesla App Style Floating Callouts with Vertical Leader Lines -->
        <div id="callouts-layer" class="pointer-events-none absolute inset-0 z-10 overflow-hidden">

          <!-- 1. 太陽能 SOLAR (Above Front Solar Panel, Line Going Down to Roof Panel) -->
          <div id="callout-solar" class="absolute flex flex-col items-center text-center" style="left: 51.6%; top: 35.4%; transform: translate(-50%, -100%);">
            <div id="hero-solar-label" class="text-[11px] text-zinc-400 font-medium tracking-wider leading-tight drop-shadow-[0_1px_4px_rgba(0,0,0,0.9)]">太陽能</div>
            <div id="hero-solar-val" class="text-xl font-bold text-zinc-400 tabular-nums leading-tight drop-shadow-[0_1px_6px_rgba(0,0,0,0.95)]">0 kW</div>
            <div class="w-[1.5px] h-14 bg-zinc-400/55 mt-1"></div>
          </div>

          <!-- 2. 住家 HOME (Above Right Roof, Line Going Down to Right Window) -->
          <div id="callout-home" class="absolute flex flex-col items-center text-center" style="left: 69.9%; top: 58.2%; transform: translate(-50%, -100%);">
            <div class="text-[11px] text-zinc-400 font-medium tracking-wider leading-tight drop-shadow-[0_1px_4px_rgba(0,0,0,0.9)]">住家</div>
            <div id="hero-home-val" class="text-xl font-bold text-white tabular-nums leading-tight drop-shadow-[0_1px_6px_rgba(0,0,0,0.95)]">-- kW</div>
            <div class="w-[1.5px] h-20 bg-zinc-400/55 mt-1"></div>
          </div>

          <!-- 3. POWERWALL (Directly Below Powerwall 2, Line Going Up to Powerwall Bottom) -->
          <div id="callout-pw" class="absolute flex flex-col items-center text-center" style="left: 39.1%; top: 81.6%; transform: translate(-50%, 0);">
            <div class="w-[1.5px] h-3.5 bg-zinc-400/55 mb-1"></div>
            <div class="text-[11px] text-zinc-400 font-medium tracking-widest uppercase leading-tight drop-shadow-[0_1px_4px_rgba(0,0,0,0.9)]">POWERWALL</div>
            <div id="hero-pw-val" class="flex items-center justify-center gap-1.5 text-xl font-bold text-white tabular-nums leading-tight whitespace-nowrap drop-shadow-[0_1px_6px_rgba(0,0,0,0.95)]">
              <span id="hero-pw-kw">0 kW</span>
              <span id="hero-pw-dot" class="text-white">·</span>
              <img id="hero-pw-arrow" src="/recovered/gdre_project/Energy/Labels/ChargeIcon.svg" alt="" class="hidden w-3.5 h-3 select-none" />

            </div>
          </div>

          <!-- 4. 電網 GRID (Directly Below Street Grid Wire, Short Line Going Up to Grid Wire) -->

            <div class="w-[1.5px] h-2.5 bg-zinc-400/55 mb-1"></div>

          </div>

    </section>

    <!-- ================= 2. UNIFIED STACKED 24H TIMELINE PANEL (INSIDE 720x720 SQUARE) ================= -->

      </div>

      <!-- STACKED 3 CHARTS SHARING ONE 00:00 - 24:00 X-AXIS AND ONE VERTICAL CURSOR -->

        <!-- Continuous Vertical "NOW" Cursor Overlay -->

          <div class="w-13 shrink-0" style="width: 52px;"></div>
          <div class="relative flex-1 ml-2">
            <div id="shared-cursor" class="absolute top-1 bottom-3.5 z-30 transition-all duration-300" style="left: 0%;">
              <div class="-translate-x-1/2 flex flex-col items-center h-full">
                <div class="w-0.5 flex-1 bg-white/90 shadow-[0_0_10px_#ffffff]"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-0.5">

          <!-- TRACK 1: 住家用電趨勢 -->
          <div class="flex items-stretch gap-2">
            <div class="relative shrink-0 text-right text-[10px] text-zinc-500 tabular-nums" style="width: 52px;">
              <span class="absolute right-0 top-0 text-sky-400 font-semibold leading-none">住家 kW</span>
              <span class="absolute right-0 top-1/2 -translate-y-1/2 leading-none">3 kW</span>

            </div>
            <div class="relative h-[52px] flex-1 bg-zinc-950/70 rounded-t-xl border border-white/5 overflow-hidden">
              <svg viewBox="0 0 600 100" preserveAspectRatio="none" class="w-full h-full">
                <defs>
                  <linearGradient id="grad-area-home" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
                    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
                  </linearGradient>
                </defs>
                <line x1="0" y1="50" x2="600" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
                <line x1="0" y1="99" x2="600" y2="99" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
                <path id="home-area-path" d="M 0,100 L 0,100 Z" fill="url(#grad-area-home)" />
                <path id="home-line-path" d="M 0,100 L 0,100" fill="none" stroke="#38bdf8" stroke-width="2.5" />
                <circle id="home-now-dot" cx="0" cy="100" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="2.5" />
              </svg>
            </div>
          </div>

          <!-- TRACK 2: POWERWALL 電量 % -->
          <div class="flex items-stretch gap-2">
            <div class="relative shrink-0 text-right text-[10px] text-zinc-500 tabular-nums" style="width: 52px;">
              <span class="absolute right-0 top-0 text-[#00e676] font-semibold leading-none">PW 100%</span>
              <span class="absolute right-0 top-1/2 -translate-y-1/2 leading-none">50%</span>
              <span id="y-label-reserve" class="absolute right-0 top-[76%] -translate-y-1/2 text-sky-400/90 leading-none">24%</span>
              <span class="absolute right-0 bottom-0 leading-none">0%</span>
            </div>
            <div class="relative h-[62px] flex-1 bg-zinc-950/70 border-x border-b border-white/5 overflow-hidden">
              <svg viewBox="0 0 600 130" preserveAspectRatio="none" class="w-full h-full">
                <defs>
                  <linearGradient id="grad-area-pw" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#00e676" stop-opacity="0.45" />
                    <stop offset="100%" stop-color="#00e676" stop-opacity="0.08" />
                  </linearGradient>
                </defs>
                <line x1="0" y1="65" x2="600" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
                <line id="pw-reserve-line" x1="0" y1="98.8" x2="600" y2="98.8" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" stroke-dasharray="5 5" />
                <line x1="0" y1="129" x2="600" y2="129" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

                <path id="pw-area-solid" d="M 0,4 L 0,4 L 0,130 L 0,130 Z" fill="url(#grad-area-pw)" />
                <path id="pw-line-solid" d="M 0,4 L 0,4" fill="none" stroke="#00e676" stroke-width="3" />
                <circle id="pw-now-dot" cx="0" cy="4" r="4.5" fill="#ffffff" stroke="#00e676" stroke-width="2.5" />
              </svg>
            </div>
          </div>

          <!-- TRACK 3: 時間表 (Fixed 20px height) -->
          <div class="flex items-center gap-2 h-[20px]">
            <div id="tou-track-label" class="shrink-0 text-right text-[10px] text-emerald-400 font-semibold leading-none" style="width: 52px;">
              週末費率
            </div>
            <!-- Weekend Bar (All Green 00:00 - 24:00) -->
            <div id="tou-bar-weekend" class="flex-1 flex items-center rounded-full overflow-hidden">
              <div class="w-full bar-offpeak rounded-full"></div>
            </div>
            <!-- Weekday Season 1 Bar (0-6 Green, 6-11 Red, 11-14 Green, 14-24 Red) -->
            <div id="tou-bar-weekday-s1" class="hidden flex-1 flex items-center rounded-full overflow-hidden">
              <div style="width: 25%;" class="bar-offpeak rounded-l-full"></div>
              <div style="width: 20.83%;" class="bar-peak"></div>
              <div style="width: 12.5%;" class="bar-offpeak"></div>
              <div style="width: 41.67%;" class="bar-peak rounded-r-full"></div>
            </div>
            <!-- Weekday Season 2 Bar (0-9 Green, 9-24 Red) -->
            <div id="tou-bar-weekday-s2" class="hidden flex-1 flex items-center rounded-full overflow-hidden">
              <div style="width: 37.5%;" class="bar-offpeak rounded-l-full"></div>
              <div style="width: 62.5%;" class="bar-peak rounded-r-full"></div>
            </div>
          </div>

          <!-- SHARED SINGLE 24-HOUR AXIS (00:00 to 24:00) -->
          <div class="flex items-center gap-2">
            <div class="shrink-0" style="width: 52px;"></div>
            <div class="flex-1 flex justify-between text-[10px] text-zinc-400 font-medium tabular-nums leading-none pt-0.5">
              <span>00:00</span>
              <span>06:00</span>
              <span>11:00</span>
              <span>14:00</span>
              <span>18:00</span>
              <span>24:00</span>
            </div>
          </div>

        </div>
      </div>

    </section>

  </main>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import { loadRedModel3Performance } from "/previews/model3_vehicle.js";
    import { loadOriginalWeather } from "/previews/original_weather.js";
    import { loadOriginalWindowMaterial, windowPresets } from "/previews/window_preview.js";

    const stageContainer = document.querySelector("#stage-container");
    const canvas = document.querySelector("#stage");

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(stageContainer.clientWidth, stageContainer.clientHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101820);

    const camera = new THREE.PerspectiveCamera(28, stageContainer.clientWidth / stageContainer.clientHeight, 0.01, 1000);
    camera.position.set(4.614, 1.92, 3.516);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-2, 0.302, -1);
    controls.enabled = false;
    controls.enableRotate = false;
    controls.enableZoom = false;
    controls.enablePan = false;
    camera.lookAt(controls.target);
    controls.update();

    scene.add(new THREE.HemisphereLight(0xb9c9df, 0x17202d, 1.8));
    const key = new THREE.DirectionalLight(0xffefd0, 2.2);
    key.position.set(5, 8, 6);
    key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x8eaff0, 0.7);
    fill.position.set(-5, 4, -4);
    scene.add(fill);

    // ================= REAL-TIME STATE VARIABLES =================
    let latestData = null;
    let latestWeather = null;
    let latestTouConfig = null;
    let lastAppliedWeatherSignature = "";
    let lastRouteSignature = "";
    let weather = null;
    let sceneMaterials = null;

    let offGridXNode = null;
    const wireMeshes = {};
    const wireRanges = {};
    const wirePathLengths = {};
    let pendingPowerflowState = {
      solarW: 0,
      pwW: 0,
      gridW: 0,
      loadW: 0,
      soePct: 100,
      isOffGrid: false
    };

    const loader = new GLTFLoader();

    const weatherReady = loadOriginalWeather({ scene, loader }).then(controller => {
      weather = controller;
      applyWeatherVisuals(true);
      return controller;
    }).catch(error => {
      console.error("Weather load error:", error);
    });

    const source = "../recovered/gdre_project/Energy/Load/Residential/Classic/ResidentialClassic.glb";
    const powerwallSource = "../recovered/gdre_project/Energy/Battery/Powerwall2/Powerwall2.glb";
    const solarSource = "../recovered/gdre_project/Energy/Load/Residential/Classic/SolarPanel.glb";
    const gatewaySource = "../recovered/gdre_project/Energy/Gateway/Gateway.glb";
    const wallConnectorSource = "../recovered/gdre_project/Energy/WallConnector/WallConnector.glb";
    const wallConnectorCableSource = "../recovered/gdre_project/Energy/WallConnector/VertexPaintedStowedCable.glb";
    const pluggedWallConnectorCableSource = "../recovered/gdre_project/Energy/WallConnector/VertexPaintedWallConnectorCable.glb";
    const textureLoader = new THREE.TextureLoader();
    const textureRoot = "../recovered/gdre_project/Energy/";
    const animatedMaterials = [];
    let vehicleModel = null;
    let vehicleChargePort = null;
    let stowedWallCable = null;
    let pluggedWallCable = null;

    async function loadTexture(path, isColor = true) {
      const texture = await textureLoader.loadAsync(textureRoot + path);
      texture.flipY = false;
      if (isColor) texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeFlowMaterial(direction = 1, phase = 1.78, terminateAt = 1000.0, flowColor = 0x00e286, depthOffset = 0.2) {
      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        vertexColors: true,
        uniforms: {
          currentTime: { value: 0 },
          direction: { value: direction },
          phaseOffset: { value: phase },
          pulseLength: { value: 9.0 },
          pulseFrequency: { value: 2.0 },
          snakeFraction: { value: 0.6 },
          snakeExponent: { value: 2.0 },
          wireTerminateAt: { value: terminateAt },
          depthOffset: { value: depthOffset },
          routeEnabled: { value: false },
          routeScale: { value: 1 },
          routeOffset: { value: 0 },
          routeTotal: { value: 1 },
          routeTail: { value: 9.0 * 0.6 },
          routeGap: { value: 1 },
          routeSpeed: { value: 4.5 },
          routeStart: { value: 0 },
          baseColor: { value: new THREE.Color(0x59636e) },
          flowColor: { value: new THREE.Color(flowColor) }
        },
        vertexShader: `
          #include <skinning_pars_vertex>
          uniform float depthOffset;
          varying vec2 vUv;
          varying vec4 vColor;
          void main() {
            vUv = uv;
            vColor = color;
            #include <skinbase_vertex>
            #include <begin_vertex>
            #include <skinning_vertex>
            vec4 clipPosition = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
            gl_Position = clipPosition - vec4(0.0, 0.0, depthOffset * color.g, 0.0);
          }
        `,
        fragmentShader: `
          uniform float currentTime;
          uniform float direction;
          uniform float phaseOffset;
          uniform float pulseLength;
          uniform float pulseFrequency;
          uniform float snakeFraction;
          uniform float snakeExponent;
          uniform float wireTerminateAt;
          uniform bool routeEnabled;
          uniform float routeScale;
          uniform float routeOffset;
          uniform float routeTotal;
          uniform float routeTail;
          uniform float routeGap;
          uniform float routeSpeed;
          uniform float routeStart;
          uniform vec3 baseColor;
          uniform vec3 flowColor;
          varying vec2 vUv;
          varying vec4 vColor;
          void main() {
            if (vUv.x > wireTerminateAt) discard;
            float timeOffset = currentTime / pulseFrequency;
            float wave = pow(
              max(1.0 - fract(timeOffset + direction * (vUv.x / pulseLength + phaseOffset)) / snakeFraction, 0.0),
              snakeExponent
            );
            wave *= abs(direction);
            if (routeEnabled) {
              float distanceAlongRoute = vUv.x * routeScale + routeOffset;
              float head = mod(max(currentTime - routeStart, 0.0) * routeSpeed, routeTotal + routeTail + routeGap);
              float age = head - distanceAlongRoute;
              wave = age >= 0.0 && age <= routeTail ? pow(1.0 - age / routeTail, snakeExponent) : 0.0;
            }
            vec3 color = mix(baseColor, flowColor, smoothstep(0.0, 1.0, wave));
            float alpha = 0.94 * (1.0 - vColor.r);
            color *= mix(0.5, 1.0, vColor.b) * mix(0.75, 1.0, vColor.g);
            gl_FragColor = vec4(color, alpha);
          }
        `
      });
      animatedMaterials.push(material);
      return material;
    }

    function makeSOEMaterial(maskTexture) {
      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          textureMask: { value: maskTexture },
          time: { value: 0 },
          soe: { value: 1.0 },
          pulsePhase: { value: 0.65 },
          pulseFrequency: { value: 2.0 },
          pulseStrength: { value: 1.0 },
          baseColor: { value: new THREE.Color(0x82b39e) },
          pulseColor: { value: new THREE.Color(0x00e286) }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D textureMask;
          uniform float time;
          uniform float soe;
          uniform float pulsePhase;
          uniform float pulseFrequency;
          uniform float pulseStrength;
          uniform vec3 baseColor;
          uniform vec3 pulseColor;
          varying vec2 vUv;
          const float TAU = 6.28318530718;
          void main() {
            float mask = texture2D(textureMask, vUv).r;
            float brightness = smoothstep(soe + 0.005, soe - 0.005, 1.0 - vUv.y);
            float pulse = pow(sin((time / pulseFrequency + pulsePhase) * TAU) * 0.5 + 0.5, 1.5);
            pulse = mix(1.0, pulse, pulseStrength);
            gl_FragColor = vec4(mix(baseColor, pulseColor, pulse), mask * brightness);
          }
        `
      });
      animatedMaterials.push(material);
      return material;
    }

    function makeMaterials(textures) {
      return {
        house: new THREE.MeshStandardMaterial({ color: 0x3a414d, roughness: 0.82, metalness: 0.02 }),
        window: null,
        makeWire: (direction, phase, terminateAt, flowColor) => makeFlowMaterial(direction, phase, terminateAt, flowColor),
        solar: new THREE.MeshStandardMaterial({ map: textures.solarAlbedo, roughnessMap: textures.solarMRA, roughness: 0.34, metalness: 0.48 }),
        powerwall: new THREE.MeshStandardMaterial({ map: textures.productAlbedo, roughnessMap: textures.productMRA, roughness: 0.38, metalness: 0.18 }),
        soe: makeSOEMaterial(textures.soe),
        gateway: new THREE.MeshStandardMaterial({ map: textures.productAlbedo, roughnessMap: textures.productMRA, roughness: 0.42, metalness: 0.12 }),
        wallConnector: new THREE.MeshStandardMaterial({ map: textures.productAlbedo, roughnessMap: textures.productMRA, roughness: 0.38, metalness: 0.16 }),
        wallConnectorCable: makeFlowMaterial(0, 1.78, 1000.0, 0x383838, 0),
        garageVehicleShadow: new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: { textureShadow: { value: textures.vehicleGarage } },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D textureShadow;
            varying vec2 vUv;
            void main() {
              float alpha = 1.0 - texture2D(textureShadow, vUv).g;
              gl_FragColor = vec4(vec3(0.0), alpha);
            }
          `
        }),
        offGridX: new THREE.MeshBasicMaterial({ color: 0xff3a3a })
      };
    }

    function prepareAsset(asset, kind, materials) {
      asset.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;
        const name = `${node.name} ${node.material?.name || ""}`.toLowerCase();

        if (kind === "house" && name.includes("garagedoor")) {
          node.visible = false;
          return;
        }
        if (kind === "house" && name.includes("garagevehicleshadow")) {
          node.visible = true;
          node.material = materials.garageVehicleShadow;
          return;
        }
        if (kind === "house" && (name.includes("shadow") || name.includes("groundreflection"))) {
          node.visible = false;
          return;
        }
        if ((kind === "powerwall" || kind === "gateway" || kind === "wallconnector") &&
            (name.includes("shadow") || name.includes("reflection"))) {
          node.visible = false;
          return;
        }
        if (kind === "wallconnector-cable") {
          node.material = materials.wallConnectorCable;
          return;
        }
        if (kind === "house" && name.includes("offgridx")) {
          node.material = materials.offGridX;
          node.visible = false;
          offGridXNode = node;
          return;
        }
        if (kind === "house" && name.includes("powerflow")) {
          const keep = name.includes("powerflowgrid-1-a") ||
            name.includes("powerflowload-1-a") ||
            name.includes("powerflowbatterywithoutinverter-1-a") ||
            name.includes("powerflowsolarmeter-1-a");
          if (!keep) {
            node.visible = false;
            return;
          }
        }
        if (kind === "solar") node.material = materials.solar;
        else if (kind === "powerwall") node.material = name.includes("soe") ? materials.soe : materials.powerwall;
        else if (kind === "gateway") node.material = materials.gateway;
        else if (kind === "wallconnector") node.material = materials.wallConnector;
        else if (name.includes("window") || name.includes("glass")) node.material = materials.window;
        else if (name.includes("powerflow")) {
          let direction = 0;
          if (name.includes("powerflowgrid")) direction = 1;
          else if (name.includes("powerflowload")) direction = -1;
          const terminateAt = name.includes("powerflowsolarmeter-1-a") ? 2.2 : 1000.0;
          let flowColor = 0xaaaaaa;
          if (name.includes("powerflowsolarmeter")) flowColor = 0xffc107;
          node.material = materials.makeWire(direction, 1.78, terminateAt, flowColor);
        }
        else if (!node.material || kind === "house") node.material = materials.house;
      });
      return asset;
    }

    function measureCableLength(mesh, maxUvLimit = Infinity) {
      mesh.updateWorldMatrix(true, false);
      const uv = mesh.geometry.attributes.uv, position = mesh.geometry.attributes.position;
      const sections = new Map(), point = new THREE.Vector3();
      for (let i = 0; i < uv.count; i++) {
        const uVal = uv.getX(i);
        if (uVal > maxUvLimit) continue;
        const key = Math.round(uVal * 1e5);
        let section = sections.get(key);
        if (!section) { section = { u: uVal, x: 0, y: 0, z: 0, count: 0 }; sections.set(key, section); }
        point.fromBufferAttribute(position, i).applyMatrix4(mesh.matrixWorld);
        section.x += point.x; section.y += point.y; section.z += point.z; section.count++;
      }
      const ordered = [...sections.values()].sort((a, b) => a.u - b.u);
      let length = 0;
      for (let i = 1; i < ordered.length; i++) {
        const a = ordered[i - 1], b = ordered[i];
        length += Math.hypot(b.x / b.count - a.x / a.count, b.y / b.count - a.y / a.count, b.z / b.count - a.z / a.count);
      }
      return length > 0 ? length : 1;
    }

    function initWireMeshes(model) {
      const names = {
        grid: "PowerflowGrid-1-A",
        load: "PowerflowLoad-1-A",
        battery: "PowerflowBatteryWithoutInverter-1-A",
        solar: "PowerflowSolarMeter-1-A"
      };
      for (const [key, name] of Object.entries(names)) {
        const mesh = model.getObjectByName(name);
        if (!mesh?.isMesh) continue;
        wireMeshes[key] = mesh;
        const uv = mesh.geometry.attributes.uv;
        let min = Infinity, max = -Infinity;
        for (let i = 0; i < uv.count; i++) {
          min = Math.min(min, uv.getX(i));
          max = Math.max(max, uv.getX(i));
        }
        const uvLimit = key === "solar" ? 2.2 : Infinity;
        if (key === "solar") max = Math.min(max, 2.2);
        wireRanges[key] = [min, max];
        wirePathLengths[key] = measureCableLength(mesh, uvLimit);
      }
    }

    function apply3DPowerflow(state, forceReset = false) {
      pendingPowerflowState = state;
      const { solarW, pwW, gridW, loadW, soePct, isOffGrid } = state;

      if (sceneMaterials && sceneMaterials.soe) {
        const clampedSoe = Math.max(0, Math.min(100, soePct)) / 100.0;
        sceneMaterials.soe.uniforms.soe.value = clampedSoe;
        sceneMaterials.soe.uniforms.pulseStrength.value = Math.abs(pwW) > 60 ? 1.0 : 0.25;
      }

      if (offGridXNode) {
        offGridXNode.visible = Boolean(isOffGrid);
      }

      if (!wireMeshes.grid || !wireMeshes.load || !wireMeshes.battery) return;

      const sources = [];
      const sinks = [];

      if (solarW > 60 && wireRanges.solar) sources.push("solar");
      if (pwW > 60) sources.push("battery");
      else if (pwW < -60) sinks.push("battery");

      if (!isOffGrid) {
        if (gridW > 60) sources.push("grid");
        else if (gridW < -60) sinks.push("grid");
      }

      if (loadW > 60) sinks.push("load");

      const routeSig = `${Boolean(isOffGrid)}|${sources.join(",")}->${sinks.join(",")}`;
      const sigChanged = forceReset || routeSig !== lastRouteSignature;
      lastRouteSignature = routeSig;

      const uvLength = (name) => wireRanges[name][1] - wireRanges[name][0];
      const length = (name) => wirePathLengths[name] ?? uvLength(name);
      const scale = (name) => length(name) / uvLength(name);
      const referenceScale = scale("battery");

      let route = null;
      if (sources.length === 1 && sinks.length >= 1) {
        const src = sources[0];
        const sourceLength = length(src);
        const sourceScale = scale(src);
        const branches = { [src]: { scale: -sourceScale, offset: wireRanges[src][1] * sourceScale } };
        for (const sink of sinks) {
          const sinkScale = scale(sink);
          branches[sink] = { scale: sinkScale, offset: sourceLength - wireRanges[sink][0] * sinkScale };
        }
        route = {
          branches,
          sourceLength,
          total: sourceLength + Math.max(...sinks.map(length)),
          tail: 9 * 0.6 * referenceScale,
          gap: 1 * referenceScale,
          speed: (9 / 2) * referenceScale
        };
      } else if (sources.length > 1 && sinks.length >= 1) {
        const sourceLength = Math.max(...sources.map(length));
        const branches = {};
        for (const src of sources) {
          const srcScale = scale(src);
          branches[src] = { scale: -srcScale, offset: sourceLength };
        }
        for (const sink of sinks) {
          const sinkScale = scale(sink);
          branches[sink] = { scale: sinkScale, offset: sourceLength - wireRanges[sink][0] * sinkScale };
        }
        route = {
          branches,
          sourceLength,
          total: sourceLength + Math.max(...sinks.map(length)),
          tail: 9 * 0.6 * referenceScale,
          gap: 1 * referenceScale,
          speed: (9 / 2) * referenceScale
        };
      }

      const start = performance.now() / 1000;
      for (const [key, mesh] of Object.entries(wireMeshes)) {
        const u = mesh.material.uniforms;
        const branch = route ? route.branches[key] : null;
        mesh.visible = true;
        u.routeEnabled.value = Boolean(branch);
        u.direction.value = 0;
        if (!branch) continue;
        u.routeScale.value = branch.scale;
        u.routeOffset.value = branch.offset;
        u.routeTotal.value = route.total;
        u.routeTail.value = route.tail;
        u.routeGap.value = route.gap;
        u.routeSpeed.value = route.speed;
        if (sigChanged) {
          u.routeStart.value = start;
        }
      }
    }

    function applyCarState() {
      if (vehicleModel) vehicleModel.visible = true;
      if (stowedWallCable) stowedWallCable.visible = false;
      if (pluggedWallCable) pluggedWallCable.visible = true;
      updatePluggedCableEndpoint();
    }

    function updatePluggedCableEndpoint() {
      if (!vehicleChargePort || !pluggedWallCable) return;
      scene.updateMatrixWorld(true);
      const targetWorld = new THREE.Vector3();
      vehicleChargePort.getWorldPosition(targetWorld);
      pluggedWallCable.traverse((node) => {
        if (!node.isSkinnedMesh || !node.skeleton) return;
        const endBone = node.skeleton.getBoneByName("end");
        if (!endBone || !endBone.parent) return;
        const targetLocal = endBone.parent.worldToLocal(targetWorld.clone());
        endBone.position.copy(targetLocal);
        endBone.updateMatrixWorld(true);
        node.skeleton.update();
        pluggedWallCable.updateMatrixWorld(true);
        node.computeBoundingBox();
        node.computeBoundingSphere();
      });
    }

    const LOCKED_CAM_POS = new THREE.Vector3(4.614, 1.92, 3.516);
    const LOCKED_CAM_TARGET = new THREE.Vector3(-2, 0.302, -1);

    const CALLOUT_ANCHORS_3D = {
      "callout-solar": new THREE.Vector3(-0.4, 1.14, 0.0),
      "callout-home":  new THREE.Vector3(0.0, 0.39, -0.80),
      "callout-pw":    new THREE.Vector3(0.0, -0.02, 0.92),
      "callout-grid":  new THREE.Vector3(0.85, -0.02, 0.19)
    };

    function projectCalloutAnchors() {
      camera.updateMatrixWorld(true);
      for (const [id, worldPt] of Object.entries(CALLOUT_ANCHORS_3D)) {
        const el = document.getElementById(id);
        if (!el) continue;
        const ndc = worldPt.clone().project(camera);
        const xPct = (ndc.x * 0.5 + 0.5) * 100;
        const yPct = (0.5 - ndc.y * 0.5) * 100;
        el.style.left = `${xPct.toFixed(2)}%`;
        el.style.top = `${yPct.toFixed(2)}%`;
      }
    }

    function fitCamera(model) {
      const bounds = new THREE.Box3().setFromObject(model);
      const size = bounds.getSize(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z);
      camera.near = Math.max(radius / 1000, 0.01);
      camera.far = radius * 20;
      controls.target.copy(LOCKED_CAM_TARGET);
      camera.position.copy(LOCKED_CAM_POS);
      camera.lookAt(controls.target);
      camera.updateProjectionMatrix();
      controls.update();
      projectCalloutAnchors();
    }

    async function start() {
      const textures = {
        solarAlbedo: await loadTexture("Load/Residential/Classic/SolarPanelAlbedo.png"),
        solarMRA: await loadTexture("Load/Residential/Classic/SolarPanelMRA.png", false),
        productAlbedo: await loadTexture("SharedProduct/Albedo.png"),
        productMRA: await loadTexture("SharedProduct/MRA.png", false),
        soe: await loadTexture("SharedProduct/SOE.png", false),
        vehicleGarage: await loadTexture("Load/Residential/Classic/VehicleGarage.png", false)
      };
      const materials = makeMaterials(textures);
      materials.window = await loadOriginalWindowMaterial();
      sceneMaterials = materials;
      applyWeatherVisuals(true);
      let loadedExtras = 0;
      const markExtraLoaded = () => {
        loadedExtras += 1;
        if (loadedExtras === 7) {
          applyCarState();
          apply3DPowerflow(pendingPowerflowState);
        }
      };

      loader.load(source, (gltf) => {
        const model = prepareAsset(gltf.scene, "house", materials);
        initWireMeshes(model);
        model.rotation.y = 0;
        scene.add(model);
        fitCamera(model);
        apply3DPowerflow(pendingPowerflowState, true);

        loader.load(powerwallSource, (powerwall) => {
          const anchor = model.getObjectByName("Battery") || model;
          anchor.add(prepareAsset(powerwall.scene, "powerwall", materials));
          markExtraLoaded();
        });

        loader.load(solarSource, (solar) => {
          model.add(prepareAsset(solar.scene, "solar", materials));
          weatherReady.then(controller => controller && controller.attachSolar(solar.scene)).catch(console.error);
          markExtraLoaded();
        });

        loader.load(gatewaySource, (gateway) => {
          const anchor = model.getObjectByName("Meter") || model;
          anchor.add(prepareAsset(gateway.scene, "gateway", materials));
          markExtraLoaded();
        });

        loader.load(wallConnectorSource, (wallConnector) => {
          const connector = prepareAsset(wallConnector.scene, "wallconnector", materials);
          connector.matrixAutoUpdate = false;
          connector.matrix.set(
            -8.96732e-08, 0, 0.55041, -1.70383,
            0, 0.55041, 0, 0.360496,
            -0.55041, 0, -8.96732e-08, 1.0465,
            0, 0, 0, 1
          );
          model.add(connector);
          markExtraLoaded();
        });

        loader.load(wallConnectorCableSource, (cable) => {
          stowedWallCable = prepareAsset(cable.scene, "wallconnector-cable", materials);
          model.add(stowedWallCable);
          applyCarState();
          markExtraLoaded();
        });

        loader.load(pluggedWallConnectorCableSource, (cable) => {
          pluggedWallCable = prepareAsset(cable.scene, "wallconnector-cable", materials);
          pluggedWallCable.visible = false;
          model.add(pluggedWallCable);
          applyCarState();
          markExtraLoaded();
        });

        loadRedModel3Performance(loader, renderer).then(({ model: vehicle, chargePort }) => {
          vehicleModel = vehicle;
          vehicleChargePort = chargePort;
          vehicleModel.visible = false;
          model.add(vehicleModel);
          applyCarState();
          markExtraLoaded();
        }).catch(console.error);
      });
    }

    start().catch(console.error);

    function syncStageSize() {
      const w = stageContainer.clientWidth || 704;
      const h = stageContainer.clientHeight || 452;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      projectCalloutAnchors();
    }
    addEventListener("resize", syncStageSize);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(syncStageSize).observe(stageContainer);
    }

    function frame() {
      requestAnimationFrame(frame);
      const seconds = performance.now() / 1000;
      if (weather) weather.update(seconds);
      for (const material of animatedMaterials) {
        if (material.uniforms.currentTime) material.uniforms.currentTime.value = seconds;
        if (material.uniforms.time) material.uniforms.time.value = seconds;
      }
      const background = scene.background;
      renderer.autoClear = false;
      renderer.clear();
      camera.layers.set(1);
      renderer.render(scene, camera);
      renderer.clearDepth();
      scene.background = null;
      camera.layers.set(0);
      renderer.render(scene, camera);
      scene.background = background;
      renderer.autoClear = true;
    }
    frame();

      if (!latestWeather) return;

      const moonStr = w.moon_label ? `${w.moon_label} (${w.moon_illum_pct ?? 50}%)` : "🌙 月相";

      const targetPreset = w.godot_state || {
        id: "auto",
        label: w.label || "實況",
        cloud_factor: w.cloud_cover ?? 50,
        rain_factor: 0,
        snow_factor: 0,

    function buildAreaSvgPaths(points, valueKey, maxYVal, svgHeight, topPad = 3) {
      if (!points || points.length === 0) return null;
      const coords = points.map(p => {
        const x = Math.min(600, Math.max(0, (p.hour / 24.0) * 600));
        const ratio = Math.min(1, Math.max(0, p[valueKey] / maxYVal));
        const rawY = svgHeight * (1.0 - ratio);
        const y = Math.min(svgHeight - 1, Math.max(topPad, rawY));
        return { x: x.toFixed(1), y: y.toFixed(1) };
      });
      const lineParts = coords.map((c, idx) => `${idx === 0 ? "M" : "L"} ${c.x},${c.y}`).join(" ");
      const first = coords[0];
      const last = coords[coords.length - 1];
      const areaPath = `${lineParts} L ${last.x},${svgHeight} L ${first.x},${svgHeight} Z`;
      return { linePath: lineParts, areaPath, lastX: last.x, lastY: last.y };
    }

    function updateLiveClockAndTou() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const isSummer = (month >= 6 && month <= 9);
      const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
      const hh = now.getHours().toString().padStart(2, "0");
      const mm = now.getMinutes().toString().padStart(2, "0");
      const hourFloat = now.getHours() + now.getMinutes() / 60.0 + now.getSeconds() / 3600.0;
      const cursorPct = (hourFloat / 24.0) * 100.0;

      setTouBarDisplay(isWeekend, isSummer);
      document.getElementById("shared-cursor").style.left = `${cursorPct}%`;

      const seasonKey = isSummer ? "season2" : "season1";
      const sCfg = latestTouConfig?.seasons?.[seasonKey];
      const currency = latestTouConfig?.currency || "NT$";
      const offpeakVal = sCfg?.rates?.off_peak ?? (isSummer ? 2.06 : 1.99);
      const peakVal = sCfg?.rates?.peak ?? (isSummer ? 5.16 : 4.93);
      const offpeakPrice = `${currency}${offpeakVal}`;
      const peakPrice = `${currency}${peakVal}`;

      const isWeekdayPeak = isSummer
        ? (hourFloat >= 9 && hourFloat < 24)
        : ((hourFloat >= 6 && hourFloat < 11) || (hourFloat >= 14 && hourFloat < 24));

      if (isWeekend) {
        document.getElementById("tou-now-pill").className = "text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 truncate";
        document.getElementById("tou-now-pill").textContent = `週末時間表：全天離峰 ${offpeakPrice} / kWh`;
      } else if (isWeekdayPeak) {
        document.getElementById("tou-now-pill").className = "text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-rose-500/25 text-rose-200 border border-rose-500/40 truncate";
        document.getElementById("tou-now-pill").textContent = `週間時間表：高峰時段 ${peakPrice} / kWh`;
      } else {
        document.getElementById("tou-now-pill").className = "text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 truncate";
        document.getElementById("tou-now-pill").textContent = `週間時間表：離峰時段 ${offpeakPrice} / kWh`;
      }
    }

    let showStatusIp = false;
    let lastLiveTimeStr = "--:--:--";
    let lastGatewayIp = "";

    function updateStatusPillText(stale = false) {
      if (!latestData) return;
      if (stale) {
        document.getElementById("live-status-text").textContent = showStatusIp
          ? `重試中 (${lastLiveTimeStr}) ${lastGatewayIp}`
          : `重試中 (${lastLiveTimeStr})`;
      } else {
        document.getElementById("live-status-text").textContent = showStatusIp
          ? `即時更新 (${lastLiveTimeStr}) ${lastGatewayIp}`
          : `即時更新 (${lastLiveTimeStr})`;
      }
    }

    function toggleStatusIpMode() {
      showStatusIp = !showStatusIp;
      updateStatusPillText(Boolean(latestData && latestData.stale));
    }
    window.toggleStatusIpMode = toggleStatusIpMode;

    function renderLive(t) {
      document.getElementById("site-title").textContent = t.site_name || "我的家";

      const solarW = t.meters.solar.power_w || 0;
      const loadW = t.meters.load.power_w || 0;
      const gridW = t.meters.site.power_w || 0;
      const pwW = t.battery.instant_power_w || 0;
      const soe = Math.round(t.battery.soe_percent);
      const isOffGrid = Boolean(t.grid_status && t.grid_status !== "SystemGridConnected");

      const loadKW = (loadW / 1000.0).toFixed(1);
      const gridKW = (gridW / 1000.0).toFixed(1);
      const solarKW = solarW > 60 ? (solarW / 1000.0).toFixed(1) : "0";
      const pwKW = Math.abs(pwW) > 60 ? (Math.abs(pwW) / 1000.0).toFixed(1) : "0";

      setSolarHudValue(`${solarKW} kW`, solarW > 60);
      document.getElementById("hero-home-val").textContent = `${loadKW} kW`;
      setPowerwallHudValue(`${pwKW} kW`, `${soe}%`, pwW);
      updateGridHudLabel(isOffGrid, `${gridKW} kW`);

      apply3DPowerflow({ solarW, pwW, gridW, loadW, soePct: soe, isOffGrid });

      document.getElementById("stat-home-kw").textContent = `${loadKW} kW`;
      document.getElementById("stat-home-va").textContent = `${t.meters.load.voltage_v} V · ${t.meters.load.current_a} A`;
      document.getElementById("stat-pw-soc").textContent = `${soe}%`;
      document.getElementById("stat-pw-kwh").textContent = `${t.battery.nominal_remaining_kwh} / ${t.battery.nominal_full_kwh} kWh`;
      const reservePct = Number(t.operation.backup_reserve_percent ?? 24);
      document.getElementById("stat-reserve-pct").textContent = `${reservePct}%`;
      const reserveLabelEl = document.getElementById("y-label-reserve");
      if (reserveLabelEl) {
        reserveLabelEl.textContent = `${reservePct}%`;
        reserveLabelEl.style.top = `${100 - reservePct}%`;
      }
      const reserveLineEl = document.getElementById("pw-reserve-line");
      if (reserveLineEl) {
        const reserveY = (130 * (1.0 - reservePct / 100.0)).toFixed(1);
        reserveLineEl.setAttribute("y1", reserveY);
        reserveLineEl.setAttribute("y2", reserveY);
      }

      if (t.history && t.history.length > 0) {
        const homeSvg = buildAreaSvgPaths(t.history, "load_kw", 6.0, 100, 4);
        if (homeSvg) {
          document.getElementById("home-area-path").setAttribute("d", homeSvg.areaPath);
          document.getElementById("home-line-path").setAttribute("d", homeSvg.linePath);
          document.getElementById("home-now-dot").setAttribute("cx", homeSvg.lastX);
          document.getElementById("home-now-dot").setAttribute("cy", homeSvg.lastY);
        }

        const pwSvg = buildAreaSvgPaths(t.history, "soe", 100.0, 130, 4);
        if (pwSvg) {
          document.getElementById("pw-area-solid").setAttribute("d", pwSvg.areaPath);
          document.getElementById("pw-line-solid").setAttribute("d", pwSvg.linePath);
          document.getElementById("pw-now-dot").setAttribute("cx", pwSvg.lastX);
          document.getElementById("pw-now-dot").setAttribute("cy", pwSvg.lastY);
        }
      }

      updateLiveClockAndTou();
    }

    let captivePopupOpened = false;
    let captivePopupRef = null;

    function launchCaptivePortalPopup() {
      captivePopupRef = window.open(
        "/wifimanager?captive=1",
        "ESP32_WiFiManager_CaptivePortal",
        "width=450,height=780,left=780,top=60,resizable=yes,scrollbars=yes"
      );
      if (captivePopupRef) {
        captivePopupOpened = true;
        const fallbackBanner = document.getElementById("captive-popup-fallback");
        if (fallbackBanner) fallbackBanner.classList.add("hidden");
      } else {
        const fallbackBanner = document.getElementById("captive-popup-fallback");
        if (fallbackBanner) fallbackBanner.classList.remove("hidden");
      }
    }

    function renderUnconfiguredState() {
      document.getElementById("live-dot").className = "w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping";
      document.getElementById("live-status-text").textContent = "等待配網設定...";
      setSolarHudValue("-- kW", false);
      document.getElementById("hero-home-val").textContent = "-- kW";
      setPowerwallHudValue("-- kW", "--%", 0);
      updateGridHudLabel(false, "-- kW");
      document.getElementById("stat-home-kw").textContent = "-- kW";
      document.getElementById("stat-home-va").textContent = "-- V · -- A";
      document.getElementById("stat-pw-soc").textContent = "--%";
      document.getElementById("stat-pw-kwh").textContent = "-- / -- kWh";
      apply3DPowerflow({ solarW: 0, pwW: 0, gridW: 0, loadW: 0, soePct: 0, isOffGrid: false });
      updateLiveClockAndTou();
    }

    async function pollLive() {
      try {
        const res = await fetch("/api/live");
        const data = await res.json();
        if (data && data.tou_config) {
          latestTouConfig = data.tou_config;
        }
        if (data && data.weather) {
          latestWeather = data.weather;
          applyWeatherVisuals(false);
        }
        if (data && data.telemetry && data.telemetry.unconfigured) {
          renderUnconfiguredState();
          if (!captivePopupOpened || (captivePopupRef && captivePopupRef.closed)) {
            launchCaptivePortalPopup();
          }
          return;
        }

        const fallbackBanner = document.getElementById("captive-popup-fallback");
        if (fallbackBanner) fallbackBanner.classList.add("hidden");

        if (data && data.telemetry && data.telemetry.ok) {
          latestData = data.telemetry;
          lastLiveTimeStr = new Date().toLocaleTimeString("zh-TW", { hour12: false });
          lastGatewayIp = data.telemetry.gateway_ip || "";
          const dot = document.getElementById("live-dot");
          if (data.telemetry.stale) {
            dot.className = "w-1.5 h-1.5 rounded-full bg-amber-400";
            updateStatusPillText(true);
          } else {
            dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping";
            updateStatusPillText(false);
          }
          renderLive(latestData);
        } else if (data && data.telemetry && !data.telemetry.ok) {
          const gwIp = data.telemetry.gateway_ip || "Gateway";
          document.getElementById("live-dot").className = "w-1.5 h-1.5 rounded-full bg-rose-500";
          document.getElementById("live-status-text").textContent = showStatusIp ? `連線失敗 ${gwIp}` : `連線失敗`;
        }
      } catch (e) {
        document.getElementById("live-status-text").textContent = "連線重試中...";
      }
    }

    window.launchCaptivePortalPopup = launchCaptivePortalPopup;
    window.onCaptivePortalConfigured = function(out) {
      const fallbackBanner = document.getElementById("captive-popup-fallback");
      if (fallbackBanner) fallbackBanner.classList.add("hidden");
      if (out && out.telemetry && out.telemetry.ok) {
        latestData = out.telemetry;
        renderLive(latestData);
      }
      pollLive();
    };
    window.onCaptivePortalReset = function() {
      captivePopupOpened = false;
      pollLive();
    };

    pollLive();
    setInterval(pollLive, 5000);
    setInterval(updateLiveClockAndTou, 1000);
  </script>
</body>
</html>
